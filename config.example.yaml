bind: "127.0.0.1"
base_port: 18081
status_port: 18080
state_file: "./state.json"
probe_urls:
  - "https://api.ipify.org"
  - "https://ifconfig.me/ip"
probe_timeout: 10s
health_interval: 20s
refresh_interval: 6h
dial_timeout: 10s
max_concurrent_probe: 8
log_requests: true
log_format: text

# Tagged subscription sources. Each node is labeled with its source tag.
# type is "clash" (clash-vmess) or "singbox" (sing-box JSON config).
# The legacy single "subscription_url" field still works: when "sources" is
# empty it is promoted to one source tagged "default" of type "clash".
sources:
  - tag: legacy
    type: clash
    url: "https://example.com/your-subscription.yaml"
  - tag: vpncheap
    type: singbox
    url: "https://example.com/cheap/your-token?flag=sing-box"
